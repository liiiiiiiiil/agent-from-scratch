[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-from-scratch"
version = "0.28.0"
description = "从零构建编程 Agent 的实战教程 | A step-by-step tutorial for building a coding agent from scratch"
requires-python = ">=3.10"

[project.optional-dependencies]
interactive = [
    "prompt_toolkit>=3.0,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
